name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Regenerate published artifacts
        run: |
          python scripts/export_openapi.py
          python scripts/generate_sdk_surfaces.py
          python scripts/export_research_surfaces.py
          python scripts/export_benchmark_surfaces.py
          python scripts/export_cymatic_surface.py
          python scripts/export_repository_pulse.py
          python scripts/export_readiness_report.py
          python scripts/export_example_bundle.py
          python scripts/build_runtime_proof_bundle.py
          python scripts/export_execution_journal.py

      - name: Prepare site bundle
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp advanced-technical-portfolio.html site/advanced-technical-portfolio.html
          cp technical-portfolio.html site/technical-portfolio.html
          cp model-observatory.html site/model-observatory.html
          cp benchmark-observatory.html site/benchmark-observatory.html
          cp cymatic-media-engine.html site/cymatic-media-engine.html
          cp field-notes.html site/field-notes.html
          cp cymatic-surface.css site/cymatic-surface.css
          cp cymatic-surface.js site/cymatic-surface.js
          cp research-surfaces.js site/research-surfaces.js
          cp site-controls.css site/site-controls.css
          cp site-controls.js site/site-controls.js
          cp README.md site/README.md
          cp -R docs site/docs
          cp -R proof site/proof
          cp -R openapi site/openapi
          cp -R examples site/examples
          touch site/.nojekyll

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Record Pages availability
        id: pages-state
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.pages-state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pages skipped
        if: steps.pages-state.outputs.enabled != 'true'
        run: echo "GitHub Pages is not enabled for this repository; publish bundle prepared but deployment skipped."

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_third.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_primary.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retry
        if: steps.deployment_primary.outcome != 'success'
        run: sleep 12

      - name: Retry GitHub Pages deployment
        id: deployment_retry
        if: steps.deployment_primary.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before final retry
        if: steps.deployment_primary.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        run: sleep 24

      - name: Final GitHub Pages deployment retry
        id: deployment_third
        if: steps.deployment_primary.outcome != 'success' && steps.deployment_retry.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Record degraded deploy state
        if: steps.deployment_primary.outcome != 'success' && steps.deployment_retry.outcome != 'success' && steps.deployment_third.outcome != 'success'
        run: |
          {
            echo "## Pages deployment did not stabilize"
            echo
            echo "The static site bundle built successfully, but GitHub Pages did not accept the deployment after three attempts."
            echo "This workflow remains green because the failure is on the Pages service edge rather than in the repository build."
          } >> "$GITHUB_STEP_SUMMARY"
