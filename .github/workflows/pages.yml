name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-state.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Regenerate published artifacts
        run: |
          python scripts/export_openapi.py
          python scripts/generate_sdk_surfaces.py
          python scripts/export_readiness_report.py
          python scripts/export_example_bundle.py
          python scripts/build_runtime_proof_bundle.py

      - name: Prepare site bundle
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp advanced-technical-portfolio.html site/advanced-technical-portfolio.html
          cp technical-portfolio.html site/technical-portfolio.html
          cp site-controls.css site/site-controls.css
          cp site-controls.js site/site-controls.js
          cp README.md site/README.md
          cp -R proof site/proof
          cp -R openapi site/openapi
          cp -R examples site/examples
          touch site/.nojekyll

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Record Pages availability
        id: pages-state
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: steps.pages-state.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Pages skipped
        if: steps.pages-state.outputs.enabled != 'true'
        run: echo "GitHub Pages is not enabled for this repository; publish bundle prepared but deployment skipped."

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
