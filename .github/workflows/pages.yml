name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Regenerate published artifacts
        run: |
          python scripts/export_openapi.py
          python scripts/generate_sdk_surfaces.py
          python scripts/export_research_surfaces.py
          python scripts/export_research_influence.py
          python scripts/export_benchmark_surfaces.py
          python scripts/export_cymatic_surface.py
          python scripts/export_music_observatory.py
          python scripts/export_operator_surfaces.py
          python scripts/export_industry_profiles.py
          python scripts/export_industrial_diagnostics.py
          python scripts/export_edge_topology.py
          python scripts/export_repository_pulse.py
          python scripts/export_repository_growth.py
          python scripts/export_readiness_report.py
          python scripts/export_example_bundle.py
          python scripts/build_runtime_proof_bundle.py
          python scripts/export_execution_journal.py

      - name: Prepare site bundle
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp advanced-technical-portfolio.html site/advanced-technical-portfolio.html
          cp technical-portfolio.html site/technical-portfolio.html
          cp model-observatory.html site/model-observatory.html
          cp benchmark-observatory.html site/benchmark-observatory.html
          cp cymatic-media-engine.html site/cymatic-media-engine.html
          cp research-influence.html site/research-influence.html
          cp industrial-diagnostics.html site/industrial-diagnostics.html
          cp music-observatory.html site/music-observatory.html
          cp industry-profiles.html site/industry-profiles.html
          cp field-notes.html site/field-notes.html
          cp cymatic-surface.css site/cymatic-surface.css
          cp cymatic-surface.js site/cymatic-surface.js
          cp growth-surface.js site/growth-surface.js
          cp industrial-diagnostics.js site/industrial-diagnostics.js
          cp industry-profiles.js site/industry-profiles.js
          cp music-observatory.js site/music-observatory.js
          cp research-influence.js site/research-influence.js
          cp research-surfaces.js site/research-surfaces.js
          cp site-controls.css site/site-controls.css
          cp site-controls.js site/site-controls.js
          cp README.md site/README.md
          cp CONTRIBUTING.md site/CONTRIBUTING.md
          cp CODE_OF_CONDUCT.md site/CODE_OF_CONDUCT.md
          cp SECURITY.md site/SECURITY.md
          cp -R docs site/docs
          cp -R proof site/proof
          cp -R openapi site/openapi
          cp -R examples site/examples
          touch site/.nojekyll

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate site bundle
        run: |
          test -f site/index.html
          test -f site/model-observatory.html
          test -f site/proof/research-surfaces.json
          if find site -type l | grep -q .; then
            echo "Pages artifact cannot contain symlinks." >&2
            find site -type l >&2
            exit 1
          fi
          if find site -type f -size +100M | grep -q .; then
            echo "Pages artifact contains a file larger than 100 MB." >&2
            find site -type f -size +100M >&2
            exit 1
          fi
          echo "Prepared $(find site -type f | wc -l | tr -d ' ') published files."
          du -sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
