name: Repository Growth Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "18 6 * * *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Export repository growth snapshot
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/export_repository_growth.py

      - name: Commit refreshed growth signals
        run: |
          if git diff --quiet -- proof/repository-growth.json proof/repository-growth.md proof/repository-growth-history.jsonl; then
            echo "No growth snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proof/repository-growth.json proof/repository-growth.md proof/repository-growth-history.jsonl
          git commit -m "Refresh repository growth snapshot"
          git push
