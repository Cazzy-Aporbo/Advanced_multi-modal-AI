[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-multimodal-ai"
version = "0.5.0"
description = "A multimodal runtime workbench with orchestration, retrieval, observability, and visual documentation."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Cazandra Aporbo" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "prometheus-client>=0.20,<1.0",
  "numpy>=1.26,<3.0",
  "pyarrow>=17,<21",
  "boto3>=1.35,<2.0",
  "httpx>=0.27,<1.0",
  "orjson>=3.10,<4.0",
  "qdrant-client>=1.10,<2.0"
]

[project.optional-dependencies]
runtime = [
  "torch>=2.4,<3.0",
  "torchvision>=0.19,<1.0",
  "torchaudio>=2.4,<3.0",
  "einops>=0.8,<1.0"
]
langgraph = [
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.2,<1.0"
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "hypothesis>=6.130,<7.0",
  "ruff>=0.5,<1.0"
]

[project.scripts]
amai-api = "advanced_multimodal_ai.cli:serve_command"
amai-benchmark = "advanced_multimodal_ai.cli:benchmark_command"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
